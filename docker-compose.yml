# Reference docker-compose for the four OSS NPS daemons.
#
# Spin up everything:        docker compose up -d
# Spin up just one:          docker compose up -d npsd
# Tail one daemon's logs:    docker compose logs -f nps-runner
#
# Production deployments will typically:
#   - put nps-ingress behind nginx/Caddy/Traefik for TLS termination
#   - run npsd on every machine that hosts NPS workers
#   - run nps-registry once per cluster, fronted by an internal LB
#   - run nps-runner once per machine alongside npsd

services:

  npsd:
    build:
      context: ./npsd
      dockerfile: Dockerfile
    image: labacacia/npsd:1.0.0-alpha.18
    restart: unless-stopped
    ports:
      - "127.0.0.1:17433:17433"   # loopback only — public ingress is nps-ingress
    volumes:
      - npsd-data:/data
    environment:
      NPSD_HOST: 0.0.0.0
      NPSD_PORT: 17433
      NPSD_DATA_DIR: /data
      NPSD_NDP_REGISTRY_URL: http://nps-registry:17436
      NPSD_NDP_ADVERTISE_HOST: npsd
    depends_on:
      - nps-registry

  nps-runner:
    build:
      context: ./nps-runner
      dockerfile: Dockerfile
    image: labacacia/nps-runner:1.0.0-alpha.18
    restart: unless-stopped
    depends_on:
      - npsd
    environment:
      NPSD_URL: http://npsd:17433
      NPS_REGISTRY_URL: http://nps-registry:17436
    volumes:
      - nps-runner-data:/var/lib/nps-runner

  nps-ingress:
    build:
      context: ./nps-ingress
      dockerfile: Dockerfile
    image: labacacia/nps-ingress:1.0.0-alpha.18
    restart: unless-stopped
    ports:
      - "${NPS_INGRESS_PORT:-8080}:8080"
    depends_on:
      - npsd
    environment:
      NPSINGRESS_BACKEND_HOST: npsd
      NPSINGRESS_BACKEND_PORT: 17433

  nps-registry:
    build:
      context: ./nps-registry
      dockerfile: Dockerfile
    image: labacacia/nps-registry:1.0.0-alpha.18
    restart: unless-stopped
    ports:
      - "${NPS_REGISTRY_PORT:-17436}:17436"

volumes:
  npsd-data:
  nps-runner-data:
